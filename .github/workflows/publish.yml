name: Publish APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct .apk link from Expo'
        required: true
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from Expo
        run: curl -fL --retry 3 -o alertmine.apk "${{ inputs.apk_url }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" alertmine.apk \
            --repo "${{ github.repository }}" \
            --title "Alert Mine ${{ inputs.version }}" \
            --notes "Alert Mine for Android, version ${{ inputs.version }}." \
            --latest
